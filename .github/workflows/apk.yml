name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy web files
        run: |
          mkdir www
          cp index.html style.css app.js egg-sprite.png manifest.json sw.js www/
      - name: Create Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init SmartHatch com.smarthatch.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHatch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
